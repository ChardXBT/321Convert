version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Requirements are version ranges, so only open a PR when a release
    # falls outside the range (a new major), not to bump lower bounds.
    versioning-strategy: increase-if-necessary
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
