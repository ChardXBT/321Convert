name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  gunicorn-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start gunicorn from the Procfile command
        env:
          PORT: "8000"
          TRUST_PROXY: "true"
          CONVERSION_TIMEOUT: "90"
        run: |
          eval "$(cut -d' ' -f2- Procfile)" > gunicorn.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "gunicorn did not become healthy" >&2
          cat gunicorn.log
          exit 1
      - name: Smoke conversions
        run: |
          python -c "from PIL import Image; Image.new('RGB',(64,48),'navy').save('sample.png')"
          printf 'hello pdf world\n' > sample.txt
          printf 'MZ not an executable\n' > bad.exe
          code=$(curl -s -F file=@sample.png -F target=jpg -o out.jpg -w '%{http_code}' http://127.0.0.1:8000/api/convert)
          test "$code" = "200"
          file out.jpg | grep -i jpeg
          code=$(curl -s -F file=@sample.txt -F target=pdf -o out.pdf -w '%{http_code}' http://127.0.0.1:8000/api/convert)
          test "$code" = "200"
          file out.pdf | grep -i pdf
          code=$(curl -s -F file=@bad.exe -F target=pdf -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/convert)
          test "$code" = "400"
      - name: Check the log
        if: always()
        run: |
          kill %1 || pkill -f "gunicorn.*app:app" || true
          if grep -i -E "error|traceback" gunicorn.log; then
            echo "errors found in gunicorn.log" >&2
            cat gunicorn.log
            exit 1
          fi
