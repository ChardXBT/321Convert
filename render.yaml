services:
  - type: web
    name: 321convert
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 150 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --limit-request-line 4094 --limit-request-fields 50 --access-logfile - --access-logformat '%(h)s "%(r)s" %(s)s %(b)s %(M)sms' app:app
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TRUST_PROXY
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MAX_OUTPUT_BYTES
        value: "78643200"
      - key: CONVERSION_TIMEOUT
        value: "90"
      - key: MAX_CONCURRENT_CONVERSIONS
        value: "2"
      - key: RATE_LIMIT_REQUESTS
        value: "60"
